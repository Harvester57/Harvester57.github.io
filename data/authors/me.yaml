"bio": "## About Me\r

  \r

  Hi, I’m Florian Stosse, just another information security engineer !\r

  \r

  ### Current work\r

  \r

  I currently work at the [European Space Agency](https://www.esa.int/), as a cybersecurity engineer for the Galileo programme, specifically for the [Galileo Mission Segment (GMS)](https://gssc.esa.int/navipedia/index.php/Galileo_Ground_Segment#Galileo_Mission_Segment_(GMS)).\r

  \r

  ### Experience summary\r

  \r

  I previously worked at [Safran Data Systems](https://www.safran-group.com/companies/safran-data-systems), in the Space & Communications business unit. I focused on hardening and securing our embedded Windows 7 and 10/11 platforms (Cortex family of TT&C and high data rate receivers), among other cool things :)\r

  \r

  Before that, in October 2018, I started a PhD thesis at CEA-List and ANSSI to work on formal methods applied to software security. More specifically, I was working on software defenses and hardening against hardware vulnerabilities, such as Spectre and Meltdown, using sound static analysis tools ([Frama-C](https://frama-c.com/) in particular).\r

  \r

  My thesis was under the supervision of [Julien Signoles](https://julien-signoles.fr/) (CEA), and my advisors were [Patricia Mouy](https://fr.linkedin.com/in/patricia-mouy-080a386) (ANSSI) and [Florent Kirchner](https://fr.linkedin.com/in/fkirchner) (CEA).\r

  \r

  Unfortunately, we had to put a stop to the thesis, but hey, that’s life !\r

  \r

  ### Education summary\r

  \r

  I graduated with a M.Sc in Computer Science (major in cybersecurity, minor in embedded systems) from ESIEA Paris (a top French engineering school, part of the [\"Grandes écoles\"](https://en.wikipedia.org/wiki/Grande_%C3%A9cole)) in August 2018. During my graduate studies, I was an apprentice at Bureau Veritas’ R&D center in La Défense, Paris.\r

  \r

  I worked in the RAMS department, and my main areas of work were:\r

  \r

  - software security (e.g. static analysis, SDLC),\r

  - connected/autonomous vehicles security (e.g. ISO 21434 for automotive security engineering),\r

  - and industrial systems security (e.g. ISO 62443 certification).\r

  \r

  Do not hesitate to get in touch if you want to chat about these topics (or anything else, really) !"
