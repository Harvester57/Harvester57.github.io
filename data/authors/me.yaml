  "summary": "Graduated summa cum laude, with jury honors.


    Major in cybersecurity, minor in embedded systems.


    Security engineering program [certified by ANSSI (National Cybersecurity Agency of France)](https://cyber.gouv.fr/offre-de-service/formations-entrainement-et-decouverte-des-metiers/formations/formation-labellisees-par-lanssi/formation-secnumedu/#:~:text=Ing%C3%A9nieur%20dipl%C3%B4m%C3%A9%20de%20l%27ESIEA%2C%20majeure%20cybers%C3%A9curit%C3%A9%2C%20en%20formation%20initiale%20sous%20statut%20d%27apprenti%2C%20sur%20le%20site%20de%20Paris).


    Final thesis subject: « Autonomous vehicles security ». This thesis was done in the framework of the [SESNA project](https://www.avairx.com/en/safety-and-security-of-autonomous-transport-systems/cea-sesna.html), in partnership with Bureau Veritas, CEA-List, RATP Group, EasyMile, Sherpa Engineering and BMCP. The goal of the project was to deploy an autonomous shuttle at CEA Paris-Saclay, and to study its robustness from RAMS and cybersecurity perspectives."
